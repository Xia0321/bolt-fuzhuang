# 站点路由（HTTP 与 HTTPS 共用），部署到 /etc/nginx/pinso/locations.conf
# 同一个域名下提供：前台 /、后台 /dashboard/、API /graphql/、图片 /media/ 与 /thumbnail/
# 前后台与 API 同源，无需处理跨域。

client_max_body_size 20m;

include /etc/nginx/pinso/security-headers.conf;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location /graphql/ {
    limit_req zone=pinso_api burst=60 nodelay;
    proxy_pass http://saleor_api;
    proxy_set_header Host $host;
    # 只传真实连接 IP，不保留客户端自带的 X-Forwarded-For：
    # Saleor 取其中第一个 IP 做登录防爆破，保留客户端的值会被伪造绕过
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# 账号服务（deploy/account-gw）：注册、登录、找回密码、结账提交前校验人机验证并限流
location = /api/register {
    limit_req zone=pinso_register burst=3 nodelay;
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
}
location /api/ {
    limit_req zone=pinso_auth burst=20 nodelay;
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
}

# 缩略图由 Saleor 按需生成，之后跳转到 /media/thumbnails/...
location /thumbnail/ {
    proxy_pass http://saleor_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/jwks.json {
    proxy_pass http://saleor_api;
    proxy_set_header Host $host;
}

# Jenkins（deploy/jenkins/setup.sh 安装，只监听本机）
location /jenkins/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # 构建日志实时输出，不缓冲
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
}

location /media/ {
    alias /opt/pinso/media/;
    expires 30d;
    add_header Cache-Control "public";
    include /etc/nginx/pinso/security-headers.conf;
}

# 后台管理（单页应用）
location = /dashboard {
    return 301 /dashboard/;
}
# 运营工具（独立页面，在 Dashboard catch-all 前匹配）
location = /dashboard/tools {
    return 301 /dashboard/tools/;
}
location ^~ /dashboard/tools/ {
    alias /opt/pinso/www/admin-tools/;
    try_files $uri /dashboard/tools/index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/pinso/security-headers.conf;
}
location /dashboard/ {
    alias /opt/pinso/www/dashboard/;
    try_files $uri $uri/ /dashboard/index.html;
}

# 前台静态资源带哈希，可长期缓存
location /assets/ {
    root /opt/pinso/www/storefront;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/pinso/security-headers.conf;
}

# 前台（单页应用，所有路径回落到 index.html）
location / {
    root /opt/pinso/www/storefront;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/pinso/security-headers.conf;
}
