# 站点路由（HTTP 与 HTTPS 共用），部署到 /etc/nginx/pinso/locations.conf
# 同一个域名下提供：前台 /（Saleor Paper，Node 服务 127.0.0.1:3000）、后台 /dashboard/、API /graphql/、图片 /media/ 与 /thumbnail/
# 前后台与 API 同源，无需处理跨域。

client_max_body_size 20m;

include /etc/nginx/pinso/security-headers.conf;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location /graphql/ {
    limit_req zone=pinso_api burst=60 nodelay;
    proxy_pass http://saleor_api;
    proxy_set_header Host $host;
    # 只传真实连接 IP，不保留客户端自带的 X-Forwarded-For：
    # Saleor 取其中第一个 IP 做登录防爆破，保留客户端的值会被伪造绕过
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# 账号服务（deploy/account-gw）：注册由前台 /api/auth/register 在服务端调用（本机 8100 端口），
# 对外只开放运营工具使用的管理接口
location /api/admin/ {
    limit_req zone=pinso_auth burst=20 nodelay;
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
}

# 注册：每 IP 每分钟 3 次（注册服务另有每小时、每天的注册次数限制）
location = /api/auth/register {
    limit_req zone=pinso_register burst=3 nodelay;
    proxy_pass http://storefront;
    include /etc/nginx/pinso/storefront-proxy.conf;
    client_max_body_size 16k;
}

# 前台的登录、找回密码等接口：每 IP 每分钟 20 次
location /api/auth/ {
    limit_req zone=pinso_auth burst=20 nodelay;
    proxy_pass http://storefront;
    include /etc/nginx/pinso/storefront-proxy.conf;
    client_max_body_size 16k;
}

# 前台其他接口（缓存刷新 webhook、商品列表分页等）
location /api/ {
    limit_req zone=pinso_api burst=60 nodelay;
    proxy_pass http://storefront;
    include /etc/nginx/pinso/storefront-proxy.conf;
}

# 商品导入（Saleor 后台扩展，deploy/product-importer），接口需后台员工凭证
location /importer/ {
    limit_req zone=pinso_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8200;
    proxy_set_header X-Real-IP $remote_addr;
    # 抓取、翻译、找货源（联网搜索并逐个验证）可能较慢
    proxy_read_timeout 300s;
    client_max_body_size 2m;
}

# 缩略图由 Saleor 按需生成，之后跳转到 /media/thumbnails/...
location /thumbnail/ {
    proxy_pass http://saleor_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/jwks.json {
    proxy_pass http://saleor_api;
    proxy_set_header Host $host;
}

# Jenkins（deploy/jenkins/setup.sh 安装，只监听本机）
location /jenkins/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # 构建日志实时输出，不缓冲
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
}

location /media/ {
    alias /opt/pinso/media/;
    expires 30d;
    add_header Cache-Control "public";
    include /etc/nginx/pinso/security-headers.conf;
}

# 后台管理（单页应用）
location = /dashboard {
    return 301 /dashboard/;
}
# 运营工具（独立页面，在 Dashboard catch-all 前匹配）
location = /dashboard/tools {
    return 301 /dashboard/tools/;
}
location ^~ /dashboard/tools/ {
    alias /opt/pinso/www/admin-tools/;
    try_files $uri /dashboard/tools/index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/pinso/security-headers.conf;
}
location /dashboard/ {
    alias /opt/pinso/www/dashboard/;
    try_files $uri $uri/ /dashboard/index.html;
}

# 旧版前台（React 单页应用）的网址跳转到新前台，保留已发出的邮件链接和搜索引擎收录
location = /shop { return 301 /zh/cn/products; }
location ~ ^/shop/([^/]+)/?$ { return 301 /zh/cn/categories/$1; }
location ~ ^/product/([^/]+)/?$ { return 301 /zh/cn/products/$1; }
location = /about { return 301 /zh/cn/pages/about; }
location ~ ^/pages/([^/]+)/?$ { return 301 /zh/cn/pages/$1; }
location = /cart { return 301 /zh/cn/cart; }
location = /login { return 302 /zh/cn/login; }
location = /register { return 302 /zh/cn/signup; }
location ~ ^/account(/.*)?$ { return 302 /zh/cn/account; }
# 旧邮件中的注册确认、重置密码链接（带 email 与 token 参数）
location = /confirm-account { return 302 /zh/cn/login?confirm=1&$args; }
location = /reset-password { return 302 /zh/cn/login?$args; }
# 旧订单链接 /order/<订单 ID>（Saleor ID 以 T3JkZXI6 开头），新前台的订单链接是签名令牌，改为按订单号查询
location ~ ^/order/T3JkZXI6 { return 302 /order/find; }

# 前台打包的静态资源（带哈希，前台自己设置长期缓存头），一个页面会加载几十个，不限流
location ^~ /_next/static/ {
    proxy_pass http://storefront;
    include /etc/nginx/pinso/storefront-proxy.conf;
}

# 前台（Saleor Paper，Next.js）：页面缓存、静态资源缓存头由前台自己设置
location / {
    limit_req zone=pinso_api burst=60 nodelay;
    proxy_pass http://storefront;
    include /etc/nginx/pinso/storefront-proxy.conf;
}
