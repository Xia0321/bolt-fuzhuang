# 仅 HTTP：未配置域名，或证书尚未申请时使用。部署为 /etc/nginx/sites-enabled/pinso
upstream saleor_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt 域名验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/pinso/locations.conf;
}
