# 频率限制区（必须位于 http {} 段），部署到 /etc/nginx/conf.d/pinso-ratelimit.conf
# 注册接口：每 IP 每分钟 3 次；登录、找回密码、结账等账号接口：每 IP 每分钟 20 次；
# GraphQL 与前台页面：每 IP 每秒 20 次（宽松，只防刷接口，考虑多人共用出口 IP）
# 来自本机的请求不限流：前台服务端渲染时经本机 Nginx 调用 GraphQL，所有顾客的请求都来自 127.0.0.1
# （Cloudflare 转发的请求已由 cloudflare-realip.conf 换成真实 IP，外部无法伪造成 127.0.0.1）
geo $pinso_limit_exempt {
    default 0;
    127.0.0.1 1;
    ::1 1;
}
map $pinso_limit_exempt $pinso_limit_key {
    0 $binary_remote_addr;
    1 "";
}
# 注册接口只限制提交（POST），打开注册页时读取人机验证配置（GET）不计数
map $request_method $pinso_register_key {
    POST $pinso_limit_key;
    default "";
}
limit_req_zone $pinso_register_key zone=pinso_register:10m rate=3r/m;
limit_req_zone $pinso_limit_key zone=pinso_auth:10m rate=20r/m;
limit_req_zone $pinso_limit_key zone=pinso_api:10m rate=20r/s;
limit_req_status 429;
