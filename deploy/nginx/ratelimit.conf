# 频率限制区（必须位于 http {} 段），部署到 /etc/nginx/conf.d/pinso-ratelimit.conf
# 注册接口：每 IP 每分钟 3 次；登录、找回密码、结账等账号接口：每 IP 每分钟 20 次；
# GraphQL：每 IP 每秒 20 次（宽松，只防刷接口，考虑多人共用出口 IP）
limit_req_zone $binary_remote_addr zone=pinso_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=pinso_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=pinso_api:10m rate=20r/s;
limit_req_status 429;
