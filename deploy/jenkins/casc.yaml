# Jenkins Configuration as Code，由 setup.sh 替换 __DOMAIN__ 等占位符后写入 /var/lib/jenkins/casc.yaml
# 每次 Jenkins 启动都会按此文件重新应用配置，在界面上修改的同类设置会被覆盖
jenkins:
  systemMessage: "PINSO Denim 发布：「发布商城前台」更新网站与后端服务，「发布管理后台」更新 Saleor 后台页面。进入任务后点「立即构建」，发布 GitHub main 分支的最新代码。"
  numExecutors: 1
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        # 账号和密码只保存在服务器 /etc/jenkins/admin.env 中
        - id: "${JENKINS_ADMIN_USER:-admin}"
          name: 管理员
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

security:
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy: "knownHostsFileVerificationStrategy"

unclassified:
  location:
    url: "https://__DOMAIN__/jenkins/"

jobs:
  - script: |
      pipelineJob('__JOB_NAME__') {
        displayName('发布商城前台')
        description('顾客看到的网站 + 后端服务（Saleor 接口、注册服务、商品导入、Nginx、邮件）。拉取 GitHub main → 打包前台 → 分步部署到 https://__DOMAIN__/')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('__REPO_URL__') }
                branch('*/main')
              }
            }
            scriptPath('deploy/Jenkinsfile')
            lightweight(true)
          }
        }
      }
  - script: |
      pipelineJob('__DASHBOARD_JOB_NAME__') {
        displayName('发布管理后台')
        description('Saleor 管理后台页面（https://__DOMAIN__/dashboard/）。等待 GitHub 打包完成 → 下载校验 → 替换后台页面')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('__REPO_URL__') }
                branch('*/main')
              }
            }
            scriptPath('deploy/Jenkinsfile.dashboard')
            lightweight(true)
          }
        }
      }
